<!doctype html><meta charset="utf-8"><title>Badges on grouped chat messages</title>
<style>body{font:14px Arial,sans-serif}.chat-badge{width:18px;height:18px}a{color:inherit}</style>
<!-- Sanitized native shapes: badge siblings and badges inside identity wrappers. -->
<div class="video-chat" id="grouped-vod"><div class="video-chat__message-list-wrapper">
  <div class="vod-message" id="vod-start"><span><img class="chat-badge" id="vod-start-first" alt="6-Month Subscriber badge" src="../../extension/icons/icon16.png"><img class="chat-badge" id="vod-start-extra" alt="Prime badge" src="../../extension/icons/icon16.png"></span><a class="video-chat__message-author" href="/sample_vod"><span data-a-target="chat-message-username">SampleVod</span></a><div class="video-chat__message"><span>:</span><span>First message</span></div></div>
  <div class="vod-message" id="vod-single"><img class="chat-badge" id="vod-single-first" alt="6-Month Subscriber badge" src="../../extension/icons/icon16.png"><a class="video-chat__message-author" id="vod-single-author" href="/sample_vod"><span data-a-target="chat-message-username">SampleVod</span></a><div class="video-chat__message"><span>:</span><span id="vod-single-body">Only one native badge</span></div></div>
  <div class="vod-message" id="vod-inline"><a class="video-chat__message-author" id="vod-inline-link" href="/sample_vod"><span class="chat-author__flair"><img class="chat-badge" id="vod-inline-first" alt="6-Month Subscriber badge" src="../../extension/icons/icon16.png"><img class="chat-badge" id="vod-inline-extra" alt="Prime badge" src="../../extension/icons/icon16.png"></span><span id="vod-inline-author" data-a-target="chat-message-username">SampleVod</span></a><div class="video-chat__message"><span>:</span><span id="vod-inline-body">Badges inside the author link</span></div></div>
</div></div>
<div class="chat-room"><div class="chat-scrollable-area__message-container">
  <div class="chat-line__message"><span><img class="chat-badge" id="live-start-first" alt="Moderator badge" src="../../extension/icons/icon16.png"><img class="chat-badge" id="live-start-extra" alt="Subscriber badge" src="../../extension/icons/icon16.png"></span><span class="chat-line__username" data-a-target="chat-message-username" data-a-user="sample_live">SampleLive</span><span class="chat-line__message--colon">:</span><span>First live message</span></div>
  <div class="chat-line__message" id="live-inline"><span class="chat-line__username-container"><span class="chat-line__message--flair"><button data-a-target="chat-badge" id="live-inline-control"><img class="chat-badge" id="live-inline-first" alt="Moderator badge" src="../../extension/icons/icon16.png"></button><button data-a-target="chat-badge"><img class="chat-badge" id="live-inline-extra" alt="Subscriber badge" src="../../extension/icons/icon16.png"></button></span><span id="live-inline-author" data-a-target="chat-message-username" data-a-user="sample_live">SampleLive</span></span><span class="chat-line__message--colon">:</span><span id="live-inline-body">Badges inside the username container</span></div>
</div></div>
<!-- twitch-min:production -->
