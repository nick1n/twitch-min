<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Goal-first chat carousel</title>
  <style>
    body { margin: 0; font: 14px Arial, sans-serif; }
    .chat-room__content { display: flex; flex-direction: column; width: 340px; }
    .carousel { height: 80px; flex-shrink: 0; }
    .slide { display: flex; align-items: center; gap: 8px; }
    .tw-progress-bar { height: 6px; background: #a970ff; }
    #messages { height: 200px; }
  </style>
  <!-- twitch-min:production -->
</head>
<body>
  <!-- Minimal reproduction of a goal slide: the shared transition wrapper
       has a progress indicator but none of the leaderboard-specific labels.
       Native mounting, rotation, and navigation are simulated by the tests. -->
  <section class="chat-room">
    <div class="chat-room__content">
      <div id="carousel" class="carousel">
        <div class="tw-transition-group">
          <div class="tw-transition" aria-hidden="false">
            <div class="slide">
              <button id="previous" aria-label="Previous slide">Previous</button>
              <div><strong>Help me reach Plus Level 2</strong><div>124/300 Points</div>
                <div class="tw-progress-bar" role="progressbar" aria-label="Goal progress" aria-valuenow="124" aria-valuemin="0" aria-valuemax="300"></div>
              </div>
              <button id="next" aria-label="Next slide">Next</button>
            </div>
          </div>
        </div>
      </div>
      <div id="community-wrapper">
        <div class="sticky-community-highlight"><div class="tw-transition-group">
          <div id="community-highlight" role="progressbar" aria-label="Community train progress">Community train</div>
        </div></div>
      </div>
      <div id="messages" data-a-target="chat-scroller">
        <div class="tw-transition-group"><div id="message-progress" role="progressbar" aria-label="Shared message progress">Message content</div></div>
      </div>
      <div id="plain-progress-wrapper"><div id="plain-progress" role="progressbar" aria-label="Other progress">Other progress</div></div>
      <div id="composer-wrapper"><div class="chat-input">
        <div class="tw-transition-group"><div id="composer-progress" role="progressbar" aria-label="Composer progress">Composer status</div></div>
        <button id="chat-settings" aria-label="Chat settings">Settings</button>
      </div></div>
    </div>
  </section>
  <div id="outside-carousel"><div class="tw-transition-group"><div role="progressbar" aria-label="Outside progress">Outside chat</div></div></div>
  <script>
    globalThis.nativeSlideClicks = 0;
    document.querySelector('#next').addEventListener('click', () => nativeSlideClicks++);
  </script>
</body>
</html>
