<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>twitch-min</title>
  <link rel="stylesheet" href="popup.css">
  <script src="../shared/settings.js" defer></script>
  <script src="popup.js" defer></script>
</head>
<body>
  <main aria-labelledby="app-title">
    <header>
      <div class="brand">
        <img src="../icons/logo.svg" width="28" height="28" alt="" aria-hidden="true">
        <div>
          <div class="title-line">
            <h1 id="app-title">twitch-min</h1>
            <span id="app-version" hidden></span>
          </div>
          <p class="subtitle">A cleaner Twitch</p>
        </div>
      </div>
      <div class="controls">
        <label title="Pause or resume without changing your choices">
          <input id="master-toggle" type="checkbox" disabled>
          Enabled
        </label>
        <button id="enable-all-button" type="button" title="Turn every setting on and resume" disabled hidden>Enable all settings</button>
      </div>
    </header>

    <div id="groups" role="group" aria-label="Preferences" aria-busy="true">
      <p>Loading…</p>
    </div>
    <p id="scroll-cue"><button id="more-settings" type="button" hidden>More settings ↓</button></p>

    <section id="toggle-error" aria-label="Toggle troubleshooting" hidden>
      <p id="toggle-error-message" role="alert"></p>
      <p id="reload-hint">Try refreshing the Twitch tab, then use the switch again. If the problem continues, copy the error details and report an issue.</p>
      <div class="error-actions">
        <button id="copy-error" type="button" aria-live="polite">Copy error details</button>
        <a href="https://github.com/nick1n/twitch-min/issues" target="_blank" rel="noopener noreferrer">Report the issue</a>
      </div>
      <p id="copy-error-status" role="status" hidden></p>
      <textarea id="error-details" aria-label="Error details to copy" readonly hidden></textarea>
    </section>

    <p id="status" role="status" hidden></p>

  </main>
</body>
</html>
