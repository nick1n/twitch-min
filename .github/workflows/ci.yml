name: CI

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          check-latest: true
          package-manager-cache: false
      - name: Set up pnpm
        id: pnpm
        run: |
          npm install --global "$(node -p "require('./package.json').packageManager")"
          echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ hashFiles('package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-pnpm-
      - name: Cache Puppeteer browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/puppeteer/chrome
          key: ${{ runner.os }}-${{ runner.arch }}-puppeteer-${{ hashFiles('pnpm-lock.yaml', '.puppeteerrc.cjs') }}
      - run: pnpm install --frozen-lockfile
      - name: Ensure test browser is installed
        run: pnpm exec puppeteer browsers install chrome
      - run: pnpm test
      - run: pnpm run package
      - name: Identify validated package
        id: package
        shell: bash
        run: |
          node -e "require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, 'path=dist/twitch-min-' + require('./package.json').version + '.zip\n')"
      - name: Upload validated package
        uses: actions/upload-artifact@v7
        with:
          name: twitch-min-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error

  release:
    needs: test
    if: github.event_name == 'push' && github.event.deleted == false && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          check-latest: true
          package-manager-cache: false
      - name: Tag validated version if missing
        run: node scripts/tag-version.cjs
      - name: Download validated package
        uses: actions/download-artifact@v8
        with:
          name: twitch-min-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - name: Publish validated release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          git fetch origin "refs/tags/$tag:refs/tags/$tag"
          if [ "$(git rev-parse "$tag^{commit}")" != "$GITHUB_SHA" ]; then
            echo "Skip release: existing tag points to a different commit."
            exit 0
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY"; then
            echo "Skip release: already published."
            exit 0
          fi
          mv "dist/twitch-min-$version.zip" dist/twitch-min.zip
          gh release create "$tag" dist/twitch-min.zip --repo "$GITHUB_REPOSITORY" --verify-tag --title "$tag" --generate-notes
