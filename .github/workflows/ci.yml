name: CI

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          check-latest: true
          package-manager-cache: false
      - run: npm test
      - run: npm run package
      - name: Identify validated package
        id: package
        shell: bash
        run: |
          node -e "require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, 'path=dist/twitch-min-' + require('./package.json').version + '.zip\n')"
      - name: Upload validated package
        uses: actions/upload-artifact@v7
        with:
          name: twitch-min-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error

  tag:
    needs: test
    if: github.event_name == 'push' && github.event.deleted == false && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          check-latest: true
          package-manager-cache: false
      - name: Tag validated version if missing
        run: node scripts/tag-version.cjs
